name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  medication-journal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medication-journal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test